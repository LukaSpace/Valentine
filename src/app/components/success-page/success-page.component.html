<div class="min-h-screen bg-white flex flex-col items-center justify-center overflow-hidden">
  <!-- Success message -->
  <div class="text-center mb-12 z-20">
    <h1 class="text-5xl md:text-7xl font-bold text-black mb-6">Hurra! 💖</h1>
    <p class="text-3xl md:text-4xl text-gray-800 mb-2">Jesteś moją walentynką!</p>
    <p class="text-xl text-gray-600">(You are my Valentine!)</p>
  </div>
  
  <!-- Animated happy boy and girl -->
  <div class="relative w-full max-w-4xl h-96 flex items-end justify-center mb-16">
    <!-- Floating hearts background -->
    <div class="absolute inset-0">
      <div class="absolute top-10 left-1/4 animate-float" style="animation-delay: 0s;">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-red-400" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
        </svg>
      </div>
      <div class="absolute top-20 right-1/4 animate-float" style="animation-delay: 0.5s;">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-300" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
        </svg>
      </div>
      <div class="absolute bottom-1/3 left-1/3 animate-float" style="animation-delay: 1s;">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-red-500" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
        </svg>
      </div>
    </div>
    
    <!-- Happy boy and girl together -->
    <div class="flex items-end">
      <!-- Boy -->
      <div class="relative animate-bounce" style="animation-delay: 0.2s;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" class="w-48 h-96">
          <!-- Boy's body -->
          <rect x="40" y="70" width="20" height="50" fill="none" stroke="black" stroke-width="2"/>
          <!-- Boy's head -->
          <circle cx="50" cy="50" r="20" fill="none" stroke="black" stroke-width="2"/>
          <!-- Boy's happy face -->
          <circle cx="43" cy="45" r="2" fill="black"/>
          <circle cx="57" cy="45" r="2" fill="black"/>
          <path d="M45,60 Q50,65 55,60" fill="none" stroke="black" stroke-width="2"/>
          <!-- Boy's arms (raised in celebration) -->
          <path d="M40,70 L20,40" stroke="black" stroke-width="2"/>
          <path d="M60,70 L80,40" stroke="black" stroke-width="2"/>
          <!-- Boy's legs -->
          <path d="M50,120 L40,170" stroke="black" stroke-width="2"/>
          <path d="M50,120 L60,170" stroke="black" stroke-width="2"/>
        </svg>
      </div>
      
      <!-- Girl -->
      <div class="relative animate-bounce" style="animation-delay: 0.5s;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" class="w-48 h-96">
          <!-- Girl's dress -->
          <path d="M50,120 C30,120 20,160 20,200 L80,200 C80,160 70,120 50,120 Z" fill="none" stroke="black" stroke-width="2"/>
          <!-- Girl's body -->
          <circle cx="50" cy="50" r="20" fill="none" stroke="black" stroke-width="2"/>
          <!-- Girl's happy face -->
          <circle cx="43" cy="45" r="2" fill="black"/>
          <circle cx="57" cy="45" r="2" fill="black"/>
          <path d="M45,60 Q50,70 55,60" fill="none" stroke="black" stroke-width="2"/>
          <!-- Girl's arms (raised in celebration) -->
          <path d="M30,70 L10,40" stroke="black" stroke-width="2"/>
          <path d="M70,70 L90,40" stroke="black" stroke-width="2"/>
          <!-- Girl's legs -->
          <path d="M50,200 L40,250" stroke="black" stroke-width="2"/>
          <path d="M50,200 L60,250" stroke="black" stroke-width="2"/>
          <!-- Girl's hair -->
          <path d="M30,30 Q50,10 70,30" fill="none" stroke="black" stroke-width="2"/>
        </svg>
      </div>
    </div>
    
    <!-- Big heart between them -->
    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 animate-heartbeat">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 text-red-500" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
      </svg>
    </div>
  </div>
  
  <!-- Return button -->
  <div class="mt-8 z-20">
    <button 
      routerLink="/"
      class="px-8 py-4 bg-black text-white text-xl font-bold rounded-full shadow-lg hover:bg-gray-800 hover:scale-105 transition-all duration-300">
      ← Wróć do strony głównej (Back to Home)
    </button>
  </div>
  
  <!-- Celebration message -->
  <div class="mt-12 text-center text-gray-700 max-w-2xl px-4">
    <p class="text-xl italic">"Najlepsze uczucia są jak kwiaty – rozkwitają w najbardziej nieoczekiwanych momentach."</p>
    <p class="mt-2">"The best feelings are like flowers - they bloom in the most unexpected moments."</p>
  </div>
</div>
