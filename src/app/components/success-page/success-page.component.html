<div *ngIf="!isVoucherVisible" class="min-h-screen bg-gradient-to-br from-pink-50 to-red-50 flex flex-col items-center justify-center overflow-hidden px-4">
  <!-- Background floating hearts -->
  <div class="absolute inset-0 overflow-hidden">
    <div *ngFor="let heart of successHearts; let i = index" 
         [ngStyle]="heart.style"
         class="absolute">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-full h-full">
        <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
      </svg>
    </div>
  </div>
  
  <!-- Success message -->
  <div class="text-center mb-8 md:mb-12 z-20 w-full">
    <div class="relative inline-block">
      <h1 class="text-5xl sm:text-6xl md:text-8xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-red-600 mb-4 md:mb-6 font-serif tracking-wider">
        Hurra!
      </h1>
    </div>
    <p class="text-2xl sm:text-3xl md:text-5xl text-gray-800 mb-2 font-medium">Jesteś moją walentynką!</p>
  </div>
  
  <!-- Animated happy boy and girl -->
  <div class="relative w-full h-64 sm:h-80 md:h-96 flex items-center justify-center mb-12 md:mb-16 z-10">
    <!-- Happy boy and girl together -->
    <div class="flex items-end space-x-4 sm:space-x-8 md:space-x-12">
      <!-- Together -->
      <img 
        [src]="togetherPath" 
        alt="Together" 
        class="h-auto"
        [class.w-32]="isMobile"
        [class.w-[210px]]="!isMobile"
      />
    </div>
  </div>
  
  <!-- Print button -->
  <div class="mt-8 md:mt-12 z-20 w-full justify-items-center">
    <button 
        (click)="onPrintClick()"
        class="relative px-8 py-4 md:px-16 md:py-8 bg-gradient-to-r from-red-500 to-pink-600 text-white text-2xl md:text-4xl font-bold rounded-full shadow-xl hover:from-red-600 hover:to-pink-700 hover:scale-105 md:hover:scale-110 transition-all duration-300 animate-heartbeat flex items-center justify-center gap-3 md:gap-4 group w-[fit-content] md:w-auto">
        <span class="text-shadow">Voucher</span>
        <div class="absolute -inset-1 bg-gradient-to-r from-red-400 to-pink-500 rounded-full blur opacity-30 group-hover:opacity-50 transition-opacity duration-300"></div>
      </button>
  </div>

  <!-- Return button -->
  <div class="mt-6 md:mt-6 z-20 w-full max-w-md justify-items-center">
    <button 
      routerLink="/"
      class="relative w-full px-6 py-4 md:px-10 md:py-5 bg-gradient-to-r from-gray-800 to-gray-900 text-white text-lg md:text-2xl font-bold rounded-full shadow-xl hover:from-gray-900 hover:to-black hover:scale-105 transition-all duration-300 flex items-center justify-center gap-2 md:gap-3 group">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-8 md:w-8 group-hover:-translate-x-1 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      <span class="text-center">Wróć do strony głównej</span>
    </button>
  </div>
  
  <!-- Celebration message -->
  <div class="mt-8 md:mt-16 text-center text-gray-800 w-full max-w-3xl z-20">
    <div class="bg-white/80 backdrop-blur-sm rounded-xl md:rounded-2xl p-4 md:p-8 shadow-xl">
      <p class="text-lg md:text-2xl italic text-gray-700 mb-2 md:mb-4">
        "Oto nadchodzą dni, kiedy zawrę z domem Izraela i z domem judzkim nowe przymierze."
      </p>
      <div class="mt-4 md:mt-6 flex justify-center space-x-2 md:space-x-4">
        <div class="h-1 w-8 md:w-12 bg-pink-400 rounded-full"></div>
        <div class="h-1 w-8 md:w-12 bg-red-400 rounded-full"></div>
        <div class="h-1 w-8 md:w-12 bg-pink-400 rounded-full"></div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="isVoucherVisible" 
       class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70 backdrop-blur-sm animate-fade-in"
       (click)="toggleVoucher()">
    
    <div class="relative max-w-lg w-full p-4 animate-scale-up" (click)="$event.stopPropagation()">
      <button 
        (click)="toggleVoucher()"
        class="absolute -top-10 right-0 text-white hover:text-red-400 text-3xl font-bold">
        ×
      </button>

      <img 
        src="assets/voucher.png" 
        alt="Voucher na randkę" 
        class="w-full h-auto rounded-lg shadow-2xl border-4 border-white" />
      
      <p class="text-center text-white mt-4 font-mono italic">
        Kliknij poza obrazkiem, aby zamknąć
      </p>
    </div>
  </div>
