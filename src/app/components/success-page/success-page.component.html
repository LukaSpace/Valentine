<div class="min-h-screen bg-gradient-to-br from-pink-50 to-red-50 flex flex-col items-center justify-center overflow-hidden">
  <!-- Background floating hearts -->
  <div class="absolute inset-0 overflow-hidden">
    <div *ngFor="let heart of successHearts; let i = index" 
         [ngStyle]="heart.style"
         class="absolute">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-full h-full">
        <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
      </svg>
    </div>
  </div>
  
  <!-- Success message -->
  <div class="text-center mb-12 z-20 px-4">
    <div class="relative inline-block">
      <h1 class="text-6xl md:text-8xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-red-600 mb-6 font-serif tracking-wider">
        Hurra! 💖
      </h1>
      <div class="absolute -top-4 -right-4 w-16 h-16 animate-spin-slow">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full text-yellow-400" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
        </svg>
      </div>
    </div>
    <p class="text-4xl md:text-5xl text-gray-800 mb-2 font-medium">Jesteś moją walentynką!</p>
    <p class="text-2xl text-gray-600 italic">You are my Valentine!</p>
  </div>
  
  <!-- Animated happy boy and girl -->
  <div class="relative w-full max-w-5xl h-96 flex items-end justify-center mb-16 z-10">
    <!-- Happy boy and girl together -->
    <div class="flex items-end space-x-4 md:space-x-12">
      <!-- Boy -->
      <div class="relative animate-bounce" style="animation-delay: 0.2s;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 220" class="w-56 h-96 md:w-64 md:h-104">
          <!-- Boy's hair -->
          <path d="M60,20 C70,10 90,15 90,30 C90,45 75,50 60,55 C45,50 30,45 30,30 C30,15 50,10 60,20 Z" 
                fill="#8B4513" stroke="#654321" stroke-width="1"/>
          
          <!-- Boy's face -->
          <circle cx="60" cy="55" r="25" fill="#F5CBA7" stroke="#D4A574" stroke-width="1.5"/>
          
          <!-- Boy's happy eyes -->
          <ellipse cx="50" cy="50" rx="3" ry="4" fill="#1a1a1a"/>
          <ellipse cx="70" cy="50" rx="3" ry="4" fill="#1a1a1a"/>
          
          <!-- Eye highlights -->
          <circle cx="51" cy="49" r="1" fill="white"/>
          <circle cx="71" cy="49" r="1" fill="white"/>
          
          <!-- Happy eyebrows -->
          <path d="M45,40 Q50,35 55,40" fill="none" stroke="#8B4513" stroke-width="2"/>
          <path d="M65,40 Q70,35 75,40" fill="none" stroke="#8B4513" stroke-width="2"/>
          
          <!-- Blushing cheeks -->
          <circle cx="45" cy="58" r="4" fill="#FFB6C1" opacity="0.6"/>
          <circle cx="75" cy="58" r="4" fill="#FFB6C1" opacity="0.6"/>
          
          <!-- Big happy smile -->
          <path d="M48,68 Q60,80 72,68" fill="none" stroke="#E75480" stroke-width="3"/>
          
          <!-- Boy's body - celebration shirt -->
          <path d="M60,80 L40,120 L45,160 L75,160 L80,120 L60,80 Z" 
                fill="#4A6FDC" stroke="#2E4C9E" stroke-width="1.5"/>
          
          <!-- Celebration collar -->
          <path d="M55,80 L65,80 L70,85 L50,85 Z" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
          
          <!-- Boy's arms (raised in celebration) -->
          <path d="M40,120 L20,60" stroke="#F5CBA7" stroke-width="5" stroke-linecap="round"/>
          <path d="M80,120 L100,60" stroke="#F5CBA7" stroke-width="5" stroke-linecap="round"/>
          
          <!-- Hands holding hearts -->
          <circle cx="20" cy="60" r="6" fill="#F5CBA7" stroke="#D4A574" stroke-width="1"/>
          <circle cx="100" cy="60" r="6" fill="#F5CBA7" stroke="#D4A574" stroke-width="1"/>
          
          <!-- Boy's legs -->
          <path d="M45,160 L40,210" stroke="#228B22" stroke-width="5" stroke-linecap="round"/>
          <path d="M75,160 L80,210" stroke="#228B22" stroke-width="5" stroke-linecap="round"/>
          
          <!-- Shoes -->
          <ellipse cx="40" cy="212" rx="7" ry="4" fill="#333"/>
          <ellipse cx="80" cy="212" rx="7" ry="4" fill="#333"/>
        </svg>
        
        <!-- Heart in hand -->
        <div class="absolute top-12 left-0 animate-ping" style="animation-delay: 0.5s;">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-500" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
          </svg>
        </div>
      </div>
      
      <!-- Girl -->
      <div class="relative animate-bounce" style="animation-delay: 0.5s;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 220" class="w-56 h-96 md:w-64 md:h-104">
          <!-- Girl's hair -->
          <path d="M60,20 C40,15 20,25 20,40 C20,60 40,70 60,75 C80,70 100,60 100,40 C100,25 80,15 60,20 Z" 
                fill="#8B4513" stroke="#654321" stroke-width="1"/>
          
          <!-- Girl's face -->
          <circle cx="60" cy="55" r="25" fill="#FFE0BD" stroke="#D4A574" stroke-width="1.5"/>
          
          <!-- Girl's happy eyes -->
          <ellipse cx="50" cy="50" rx="3" ry="4" fill="#1a1a1a"/>
          <ellipse cx="70" cy="50" rx="3" ry="4" fill="#1a1a1a"/>
          
          <!-- Eye highlights -->
          <circle cx="51" cy="49" r="1" fill="white"/>
          <circle cx="71" cy="49" r="1" fill="white"/>
          
          <!-- Happy eyebrows -->
          <path d="M45,40 Q50,35 55,40" fill="none" stroke="#8B4513" stroke-width="2"/>
          <path d="M65,40 Q70,35 75,40" fill="none" stroke="#8B4513" stroke-width="2"/>
          
          <!-- Blushing cheeks -->
          <circle cx="45" cy="58" r="4" fill="#FFB6C1" opacity="0.8"/>
          <circle cx="75" cy="58" r="4" fill="#FFB6C1" opacity="0.8"/>
          
          <!-- Big happy smile -->
          <path d="M48,68 Q60,80 72,68" fill="none" stroke="#E75480" stroke-width="3"/>
          
          <!-- Girl's celebration dress -->
          <path d="M60,80 L40,120 L50,160 L70,160 L80,120 L60,80 Z" 
                fill="#FF69B4" stroke="#D44D8C" stroke-width="1.5"/>
          
          <!-- Dress pattern -->
          <circle cx="60" cy="110" r="10" fill="white" opacity="0.4"/>
          
          <!-- Girl's arms (raised in celebration) -->
          <path d="M40,120 L20,60" stroke="#FFE0BD" stroke-width="5" stroke-linecap="round"/>
          <path d="M80,120 L100,60" stroke="#FFE0BD" stroke-width="5" stroke-linecap="round"/>
          
          <!-- Hands -->
          <circle cx="20" cy="60" r="6" fill="#FFE0BD" stroke="#D4A574" stroke-width="1"/>
          <circle cx="100" cy="60" r="6" fill="#FFE0BD" stroke="#D4A574" stroke-width="1"/>
          
          <!-- Girl's legs -->
          <path d="M50,160 L45,210" stroke="#FFE0BD" stroke-width="5" stroke-linecap="round"/>
          <path d="M70,160 L75,210" stroke="#FFE0BD" stroke-width="5" stroke-linecap="round"/>
          
          <!-- Shoes -->
          <ellipse cx="45" cy="212" rx="6" ry="3" fill="#FF69B4"/>
          <ellipse cx="75" cy="212" rx="6" ry="3" fill="#FF69B4"/>
        </svg>
        
        <!-- Heart in hand -->
        <div class="absolute top-12 right-0 animate-ping" style="animation-delay: 0.7s;">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-500" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
          </svg>
        </div>
      </div>
    </div>
    
    <!-- Big heart between them -->
    <div class="absolute top-1/3 left-1/2 transform -translate-x-1/2 -translate-y-1/2 animate-heartbeat">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-32 w-32 text-red-500" viewBox="0 0 24 24" fill="currentColor">
        <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
      </svg>
    </div>
  </div>
  
  <!-- Return button -->
  <div class="mt-12 z-20">
    <button 
      routerLink="/"
      class="relative px-10 py-5 bg-gradient-to-r from-gray-800 to-gray-900 text-white text-2xl font-bold rounded-full shadow-xl hover:from-gray-900 hover:to-black hover:scale-105 transition-all duration-300 flex items-center justify-center gap-3 group">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 group-hover:-translate-x-1 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      <span>Wróć do strony głównej (Back to Home)</span>
    </button>
  </div>
  
  <!-- Celebration message -->
  <div class="mt-16 text-center text-gray-800 max-w-3xl px-4 z-20">
    <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-8 shadow-xl">
      <p class="text-2xl italic text-gray-700 mb-4">
        "Miłość nie polega na tym, by się wzajemnie sobie przyglądać, lecz by patrzeć razem w tym samym kierunku."
      </p>
      <p class="text-xl text-gray-600">
        "Love does not consist of gazing at each other, but in looking together in the same direction."
      </p>
      <div class="mt-6 flex justify-center space-x-4">
        <div class="h-1 w-12 bg-pink-400 rounded-full"></div>
        <div class="h-1 w-12 bg-red-400 rounded-full"></div>
        <div class="h-1 w-12 bg-pink-400 rounded-full"></div>
      </div>
    </div>
  </div>
</div>
