<div class="relative min-h-screen bg-white overflow-hidden" #noButtonContainer>
  <!-- Animated background with floating hearts -->
  <div class="absolute inset-0 z-0 overflow-hidden">
    <!-- Floating hearts in background -->
    <div *ngFor="let heart of floatingHearts; let i = index" 
         [ngStyle]="heart.style"
         class="absolute opacity-10">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-full h-full">
        <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
      </svg>
    </div>
    
    <!-- Ground line with grass -->
    <div class="absolute bottom-28 left-0 right-0">
      <div class="h-1 md:h-2 bg-gradient-to-r from-green-800 to-green-600"></div>
      <div class="h-14 md:h-14 bg-gradient-to-r from-green-600 to-green-400"></div>
    </div>
    
    <!-- Girl (stationary) - Fixed positioning -->
    <div class="absolute bottom-32 right-[30%] md:right-[42%] transform translate-x-1/2 z-10">
      <!-- Girl SVG with detailed features - scaled for mobile -->
      <img 
        [src]="girlSvgPath" 
        alt="Girl" 
        class="h-auto"
        [class.w-[100px]]="isMobile"
        [class.w-[120px]]="!isMobile"
      />
    </div>
    
    <!-- Boy (walking animation) - Adjusted for mobile -->
    <div class="absolute bottom-32 left-0 transform -translate-x-full animate-walk z-10"
         [style.animation-duration]="isMobile ? '4s' : '5s'">
      <!-- Boy SVG with detailed features - scaled for mobile -->
      <img *ngIf="showProposalText"
        [src]="boySvgPath" 
        alt="Boy" 
        class="h-auto"
        [class.w-[140px]]="isMobile"
        [class.w-[170px]]="!isMobile"
      />
      <img *ngIf="!showProposalText"
        [src]="boyRunSvgPath" 
        alt="BoyRun" 
        class="h-auto"
        [class.w-[180px]]="isMobile"
        [class.w-[200px]]="!isMobile"
      />
    </div>
  </div>
  
  <!-- Proposal text and buttons (shown after animation) -->
  <div *ngIf="showProposalText" class="absolute inset-0 flex flex-col items-center pt-[45%] md:pt-[unset] md:top-[25%] z-20 animate-fade-in px-4">
    <div class="text-center mb-8 md:mb-12 px-2">
      <h1 class="text-3xl sm:text-4xl md:text-6xl lg:text-7xl font-bold text-black mb-4 md:mb-6 font-serif tracking-wide">
        Zostaniesz moją walentynką?
      </h1>
    </div>
    
    <div class="flex flex-col md:flex-row gap-6 md:gap-10 items-center justify-center w-full max-w-4xl">
      <!-- Yes Button -->
      <button 
        (click)="onYesClick()"
        class="relative px-8 py-4 md:px-16 md:py-8 bg-gradient-to-r from-red-500 to-pink-600 text-white text-2xl md:text-4xl font-bold rounded-full shadow-xl hover:from-red-600 hover:to-pink-700 hover:scale-105 md:hover:scale-110 transition-all duration-300 animate-heartbeat flex items-center justify-center gap-3 md:gap-4 group w-[fit-content] md:w-auto">
        <div class="relative">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 md:h-12 md:w-12 group-hover:scale-110 md:group-hover:scale-125 transition-transform duration-300" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
          </svg>
        </div>
        <span class="text-shadow">Tak</span>
        <div class="absolute -inset-1 bg-gradient-to-r from-red-400 to-pink-500 rounded-full blur opacity-30 group-hover:opacity-50 transition-opacity duration-300"></div>
      </button>
      
      <!-- No Button -->
      <button 
        *ngIf="noButtonVisible"
        #noButton
        (click)="onNoClick()"
        [ngStyle]="{
          'transform': 'translate(' + noButtonPosition.x + 'px, ' + noButtonPosition.y + 'px)',
          'position': noButtonClicks > 0 ? 'absolute' : 'relative',
          'top': noButtonClicks > 0 ? noButtonPosition.y + 'px' : 'auto',
          'left': noButtonClicks > 0 ? noButtonPosition.x + 'px' : 'auto',
          'z-index': noButtonClicks > 0 ? '50' : 'auto',
          'width': 'fit-content'
        }"
        [class.animate-explode]="isExploding"
        class="px-8 py-4 md:px-16 md:py-8 bg-gradient-to-r from-gray-50 to-gray-100 border-3 md:border-4 border-gray-300 text-gray-900 text-2xl md:text-4xl font-bold rounded-full shadow-xl hover:bg-gray-200 hover:scale-105 md:hover:scale-110 transition-all duration-300 flex items-center justify-center gap-3 md:gap-4 group relative w-full md:w-auto touch-manipulation">
        <div class="w-8 h-8 md:w-12 md:h-12 rounded-full border-3 md:border-4 border-gray-800 flex items-center justify-center bg-white group-hover:rotate-90 transition-transform duration-300">
          <span class="text-xl md:text-2xl font-black">✗</span>
        </div>
        <span class="text-shadow">Nie</span>
        <div class="absolute -inset-1 bg-gradient-to-r from-gray-300 to-gray-400 rounded-full blur opacity-30 group-hover:opacity-50 transition-opacity duration-300"></div>
      </button>
    </div>
  </div>
  
  <!-- Loading/Instructions -->
  <div *ngIf="!showProposalText" class="absolute bottom-6 left-0 right-0 text-center z-10 px-4">
    <div class="inline-block bg-white/90 backdrop-blur-sm px-4 py-3 rounded-full shadow-lg">
      <p class="text-gray-700 text-base md:text-lg font-medium">
        <span class="animate-pulse inline-block">💖</span> Zobacz jak biegnę z walentynką...
      </p>
    </div>
  </div>
</div>
